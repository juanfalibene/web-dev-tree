name: Weekly AI Curation Bot

on:
  schedule:
    # Corre todos los lunes a las 04:17 AM UTC (minuto no entero para evitar congestión en GitHub Actions)
    - cron: '17 4 * * 1'
  workflow_dispatch:
    # Permite correrlo manualmente desde Actions tab para hacer pruebas.

permissions:
  contents: write

jobs:
  curate_and_post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # cache pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Execute Curation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python scripts/curator_bot.py

      - name: Keep repository active and record history
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > scripts/.last_run
          git add scripts/.last_run
          if [ -f scripts/curated_history.json ]; then
            git add scripts/curated_history.json
          fi
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nada que commitear."
            exit 0
          fi
          git commit -m "chore(bot): update curation history & keepalive [skip ci]"
          # Reintentar por si main avanzó durante la ejecución (push rechazado)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push fallido (intento $i/3), reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

